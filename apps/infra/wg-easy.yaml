apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wg-easy-pvc
  namespace: infra
spec:
  storageClassName: "nfs-client"
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-easy
  namespace: infra
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  replicas: 1
  selector:
    matchLabels:
      app: wg-easy
  template:
    metadata:
      labels:
        app: wg-easy
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - polaris
              weight: 100
      containers:
        - name: wg-easy
          image: ghcr.io/wg-easy/wg-easy:15.4.0
          ports:
            - containerPort: 51820
              protocol: UDP
              name: wg-port
            - containerPort: 51821
              protocol: TCP
              name: web-port
          env:
            - name: LANG
              value: en
            - name: WG_MTU
              value: "1420"
            - name: UI_TRAFFIC_STATS
              value: "true"
            - name: INSECURE
              value: "true"
            - name: UI_ENABLE_SORT_CLIENTS
              value: "true"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - SYS_MODULE
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: 51821
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 51821
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: wg-easy-volume
              mountPath: /etc/wireguard
            - name: kernel-modules
              mountPath: /lib/modules
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: wg-easy-volume
          persistentVolumeClaim:
            claimName: wg-easy-pvc
        - name: kernel-modules
          hostPath:
            path: /lib/modules
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: wg-easy-svc
  namespace: infra
spec:
  type: LoadBalancer
  selector:
    app: wg-easy
  loadBalancerIP: 192.168.20.203
  ports:
    - name: wg-port
      port: 51820
      targetPort: 51820
      protocol: UDP
    - name: web-port
      port: 51821
      targetPort: 51821
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wg-easy-ingress
  namespace: infra
spec:
  rules:
    - host: vpn.haven
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wg-easy-svc
                port:
                  number: 51821
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wg-easy-pdb
  namespace: infra
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: wg-easy
